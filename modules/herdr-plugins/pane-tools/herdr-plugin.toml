id = "pane-tools"
name = "Pane Tools"
version = "0.7.0"
min_herdr_version = "0.8.0"
description = "tmux-style pane rotation and a fuzzy workspace picker"
platforms = ["macos", "linux"]

[[actions]]
id = "rotate"
title = "Rotate panes"
command = ["python3", "rotate.py"]

[[actions]]
id = "rotate-reverse"
title = "Rotate panes (reverse)"
command = ["python3", "rotate.py", "-r"]

[[actions]]
id = "pick-workspace"
title = "Workspace picker"
command = ["bash", "picker-open.sh"]

[[actions]]
id = "last-workspace"
title = "Toggle last workspace"
command = ["bash", "ws_toggle.sh"]

[[actions]]
id = "nav-left"
title = "Navigate left (vim-aware)"
command = ["bash", "nav.sh", "left"]

[[actions]]
id = "nav-down"
title = "Navigate down (vim-aware)"
command = ["bash", "nav.sh", "down"]

[[actions]]
id = "nav-up"
title = "Navigate up (vim-aware)"
command = ["bash", "nav.sh", "up"]

[[actions]]
id = "nav-right"
title = "Navigate right (vim-aware)"
command = ["bash", "nav.sh", "right"]

[[actions]]
id = "move-left"
title = "Move pane left (aerospace-style)"
command = ["python3", "move.py", "left"]

[[actions]]
id = "move-down"
title = "Move pane down (aerospace-style)"
command = ["python3", "move.py", "down"]

[[actions]]
id = "move-up"
title = "Move pane up (aerospace-style)"
command = ["python3", "move.py", "up"]

[[actions]]
id = "move-right"
title = "Move pane right (aerospace-style)"
command = ["python3", "move.py", "right"]

[[events]]
on = "workspace.focused"
command = ["bash", "ws_track.sh"]

[[panes]]
id = "picker"
title = "Workspaces"
placement = "overlay"
command = ["bash", "picker.sh"]
